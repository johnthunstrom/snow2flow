# Snow-to-Flow site configuration
# SNOTEL sites for SF Salmon, Selway, Lochsa, and Salmon at White Bird
# are verified against the USBR Snow-to-Flow pages (Lower Snake basin).
# MF Salmon sites are chosen by watershed geography (no USBR page exists).

rivers:

  - id: sf_salmon_krassel
    name: "South Fork Salmon River"
    subtitle: "near Krassel Ranger Station"
    gauge:
      agency: usgs
      site_id: "13310700"
      name: "SF Salmon R nr Krassel Ranger Station"
      parameter: "00060"
    # Verified against USBR STF page
    snotel_sites:
      - id: "338"
        state: "ID"
        name: "Big Creek Summit"
      - id: "423"
        state: "ID"
        name: "Cozy Cove"
      - id: "439"
        state: "ID"
        name: "Deadwood Summit"
      - id: "740"
        state: "ID"
        name: "Secesh Summit"
    water_year_start_month: 10

  - id: mf_salmon_lodge
    name: "Middle Fork Salmon River"
    subtitle: "near Yellow Pine (MF Lodge)"
    gauge:
      agency: usgs
      site_id: "13309220"
      name: "MF Salmon R at MF Lodge nr Yellow Pine"
      parameter: "00060"
    # No USBR STF page exists; sites chosen by watershed geography.
    # MF Salmon drains the Frank Church wilderness; key tributaries:
    # Marsh Creek (Banner Summit), Big Creek (Big Creek Summit),
    # upper MF (Mill Creek Summit, Morgan Creek).
    snotel_sites:
      - id: "312"
        state: "ID"
        name: "Banner Summit"
      - id: "338"
        state: "ID"
        name: "Big Creek Summit"
      - id: "627"
        state: "ID"
        name: "Mill Creek Summit"
      - id: "639"
        state: "ID"
        name: "Morgan Creek"
    water_year_start_month: 10

  - id: salmon_whitebird
    name: "Salmon River"
    subtitle: "at White Bird"
    gauge:
      agency: usgs
      site_id: "13317000"
      name: "Salmon R at White Bird ID"
      parameter: "00060"
    # Verified against USBR STF page (10 sites)
    snotel_sites:
      - id: "312"
        state: "ID"
        name: "Banner Summit"
      - id: "338"
        state: "ID"
        name: "Big Creek Summit"
      - id: "439"
        state: "ID"
        name: "Deadwood Summit"
      - id: "489"
        state: "ID"
        name: "Galena"
      - id: "490"
        state: "ID"
        name: "Galena Summit"
      - id: "627"
        state: "ID"
        name: "Mill Creek Summit"
      - id: "636"
        state: "ID"
        name: "Moonshine"
      - id: "639"
        state: "ID"
        name: "Morgan Creek"
      - id: "650"
        state: "ID"
        name: "Mountain Meadows"
      - id: "845"
        state: "ID"
        name: "Vienna Mine"
    water_year_start_month: 10

  - id: selway_lowell
    name: "Selway River"
    subtitle: "near Lowell"
    gauge:
      agency: usgs
      site_id: "13336500"
      name: "Selway R nr Lowell ID"
      parameter: "00060"
    # Verified against USBR STF page (2 sites)
    snotel_sites:
      - id: "650"
        state: "ID"
        name: "Mountain Meadows"
      - id: "735"
        state: "ID"
        name: "Savage Pass"
    water_year_start_month: 10

  - id: lochsa_lowell
    name: "Lochsa River"
    subtitle: "near Lowell"
    gauge:
      agency: usgs
      site_id: "13337000"
