name: Daily Build

on:
  schedule:
    # Run at 8:00 AM Mountain Time (14:00 UTC) every day
    - cron: '0 14 * * *'
  workflow_dispatch:  # Allow manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python src/build.py

      - name: Commit and push updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push
